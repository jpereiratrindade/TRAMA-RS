<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRAMA-RS</title><style>
:root{font-family:system-ui,sans-serif;color:#163028;background:#f3f0e7}body{margin:0}header{background:#174b3b;color:white;padding:2rem max(5vw,1rem)}main{max-width:1100px;margin:auto;padding:2rem 1rem}.notice{background:#fff2c7;border-left:5px solid #c77900;padding:1rem}input{font:inherit;padding:.75rem;width:min(30rem,90%)}button{font:inherit;padding:.75rem;background:#174b3b;color:white;border:0}.stats{display:flex;gap:1rem;flex-wrap:wrap}.card{background:white;padding:1rem;border-radius:.4rem;min-width:10rem;box-shadow:0 2px 8px #0001}table{width:100%;border-collapse:collapse;background:white;margin-top:1rem}td,th{text-align:left;padding:.6rem;border-bottom:1px solid #ddd}@media(max-width:600px){th:nth-child(3),td:nth-child(3){display:none}}
</style></head><body><header><h1>TRAMA-RS</h1><p>Territórios, Regiões, Ambientes, Municípios e Análises</p></header><main><p class="notice"><strong>Catálogo preliminar, não homologado.</strong> Há 495 classificações municipais de bioma pendentes. Valores desconhecidos permanecem nulos.</p><section class="stats" id="stats"></section><h2>Buscar município</h2><form id="form"><input id="q" aria-label="Nome do município" placeholder="Ex.: Caibaté"><button>Buscar</button></form><div id="results"></div><p><a href="/v1/catalogo">Fontes e versão do catálogo (JSON)</a> · <a href="/v1/estatisticas">Indicadores (JSON)</a></p></main><script>
const get=p=>fetch(p).then(r=>r.json());get('/v1/estatisticas').then(x=>{const s=x.data;stats.innerHTML=[['Municípios',s.municipios],['COREDEs',s.coredes],['Regiões Funcionais',s.regioes_funcionais],['Biomas pendentes',s.bioma_pendente]].map(([a,b])=>`<article class=card><strong>${b}</strong><br>${a}</article>`).join('')});form.onsubmit=async e=>{e.preventDefault();const x=await get('/v1/municipios?q='+encodeURIComponent(q.value));results.innerHTML=`<table><thead><tr><th>Município</th><th>COREDE</th><th>RF</th><th>IBGE</th></tr></thead><tbody>${x.data.map(m=>`<tr><td>${m.nome}</td><td>${m.corede_id}</td><td>${m.regiao_funcional_id}</td><td>${m.codigo_ibge??'não confirmado'}</td></tr>`).join('')}</tbody></table>`};
</script></body></html>
